<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Bounty</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 20px; margin: 0; }
        h1 { margin-bottom: 5px; }
        .coins { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 500px; margin: 20px auto; }
        .coin { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #34d399, #0e7a4b); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(52,211,153,0.3); }
        .coin:hover { transform: scale(1.1); }
        .coin.collected { opacity: 0.2; pointer-events: none; filter: grayscale(1); transform: scale(0.8); }
        .coin.claimed { background: #1e3a5f; opacity: 0.5; }
        .btn-connect { background: #3a3a4a; color: #fff; border: 1px solid #555; padding: 12px 28px; border-radius: 8px; cursor: pointer; margin: 10px; font-size: 16px; }
        .btn-connect:hover { background: #4a4a5a; }
        .btn-claim { background: #facc15; color: #000; border: none; padding: 14px 36px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; margin-top: 20px; transition: 0.2s; }
        .btn-claim:hover { background: #eab308; }
        .btn-claim:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { margin-top: 16px; color: #aaa; font-size: 14px; min-height: 20px; }
        .network-warn { color: #f87171; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <h1>AR Bounty</h1>
    <div>Собрано: <span id="score">0</span> / 10</div>
    <button class="btn-connect" id="connectBtn" onclick="connectManually()">🦊 Подключить MetaMask</button>
    <div class="network-warn" id="netWarn">⚠️ Переключитесь на сеть Arc (ChainID 5042) в MetaMask!</div>
    <div class="coins" id="board"></div>
    <button class="btn-claim" id="claimBtn" onclick="claimAll()">Забрать всё!</button>
    <div id="status">Нажмите кнопку для подключения</div>

<script>
    const CONTRACT = "0x5e3b652F8Ef29d50F32Ae2D69920651d10D0227b";
    const ARC_CHAIN_ID = 5042;
    const ARC_RPC = "https://rpc.testnet.arc.network";
    
    const ABI = ["function claim(bytes32 bountyId) external"];
    const IDS = [
        "0x64656d6f5f303031000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303032000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303033000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303034000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303035000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303036000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303037000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303038000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303039000000000000000000000000000000000000000000000000",
        "0x64656d6f5f303130000000000000000000000000000000000000000000000000"
    ];

    let signer, contract, provider;
    let collected = 0, ids = [];

    window.onload = function() {
        if (typeof ethers === 'undefined') {
            document.getElementById('status').innerHTML = "❌ Библиотека не загрузилась. Обновите страницу (Ctrl+F5).";
            return;
        }
        const board = document.getElementById('board');
        IDS.forEach((id, i) => {
            const c = document.createElement('div');
            c.className = 'coin';
            c.innerText = i + 1;
            c.dataset.id = id;
            c.dataset.index = i;
            c.onclick = function() { pick(this); };
            board.appendChild(c);
        });
    };

    async function connectManually() {
        const status = document.getElementById('status');
        const netWarn = document.getElementById('netWarn');
        
        if (typeof ethers === 'undefined') {
            status.innerText = "❌ Ошибка загрузки библиотеки.";
            return;
        }
        
        try {
            if (!window.ethereum) {
                status.innerHTML = "❌ MetaMask не найден.";
                return;
            }
            
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            
            provider = new ethers.providers.Web3Provider(window.ethereum, "any");
            signer = provider.getSigner();
            
            const network = await provider.getNetwork();
            if (network.chainId !== ARC_CHAIN_ID) {
                status.innerText = "⚠️ Неверная сеть!";
                netWarn.style.display = 'block';
                
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x' + ARC_CHAIN_ID.toString(16) }]
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x' + ARC_CHAIN_ID.toString(16),
                                chainName: 'Arc Testnet',
                                rpcUrls: [ARC_RPC],
                                nativeCurrency: { name: 'ARC', symbol: 'ARC', decimals: 18 },
                                blockExplorerUrls: ['https://testnet.arcscan.app']
                            }]
                        });
                    } else {
                        status.innerText = "❌ Не удалось переключить сеть";
                        return;
                    }
                }
                
                provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                signer = provider.getSigner();
            }
            
            netWarn.style.display = 'none';
            contract = new ethers.Contract(CONTRACT, ABI, signer);
            const addr = await signer.getAddress();
            
            document.getElementById('connectBtn').style.display = 'none';
            status.innerHTML = `✅ Подключено: <b>${addr.slice(0,6)}...${addr.slice(-4)}</b>`;
            
        } catch (e) {
            status.innerText = "❌ " + (e.message || "Отклонено");
        }
    }

    function pick(el) {
        if (!contract) {
            document.getElementById('status').innerText = "⛔ Сначала подключите MetaMask!";
            return;
        }
        if (el.classList.contains('collected')) return;
        
        el.classList.add('collected');
        collected++;
        ids.push({id: el.dataset.id, index: parseInt(el.dataset.index)});
        document.getElementById('score').innerText = collected;
        document.getElementById('status').innerText = `🪙 Монета ${collected} собрана`;
        
        if (collected === 10) {
            document.getElementById('claimBtn').style.display = 'inline-block';
            document.getElementById('status').innerText = "🎯 Все собраны! Жмите кнопку.";
        }
    }

    async function claimAll() {
        const btn = document.getElementById('claimBtn');
        const status = document.getElementById('status');
        
        if (!contract) {
            status.innerText = "⛔ Сначала подключите MetaMask!";
            return;
        }
        
        btn.disabled = true;
        const originalText = btn.innerText;
        btn.innerText = "⏳ Отправка...";
        
        let successCount = 0;
        let skipCount = 0;
        
        for (let i = 0; i < ids.length; i++) {
            const {id, index} = ids[i];
            try {
                status.innerText = `💰 Клейм ${i+1} из 10 (монета ${index+1})...`;
                const tx = await contract.claim(id);
                await tx.wait();
                successCount++;
                // Помечаем визуально
                const coinEl = document.querySelector(`.coin[data-index="${index}"]`);
                if (coinEl) coinEl.classList.add('claimed');
            } catch (e) {
                const msg = e.message || e.toString();
                // Если bounty уже занята или не существует — пропускаем
                if (msg.includes('No bounty') || msg.includes('already claimed') || msg.includes('execution reverted')) {
                    skipCount++;
                    status.innerText = `⏭️ Монета ${index+1} уже занята, пропускаем...`;
                    await new Promise(r => setTimeout(r, 1000)); // пауза чтобы прочитать
                    continue;
                } else {
                    // Другая ошибка — останавливаемся
                    status.innerHTML = `<span style="color:#f87171">❌ Ошибка на монете ${index+1}: ${msg.slice(0, 100)}</span>`;
                    btn.disabled = false;
                    btn.innerText = originalText;
                    return;
                }
            }
        }
        
        if (successCount > 0) {
            status.innerHTML = `<span style='color:#34d399; font-size:16px;'>🎉 Получено ${successCount} USDC! (Пропущено занятых: ${skipCount})</span>`;
        } else {
            status.innerHTML = `<span style='color:#f87171'>⚠️ Все монеты уже заняты другими. Попробуйте другие ID.</span>`;
        }
        btn.innerText = "✅ Готово!";
    }
</script>
</body>
</html>
